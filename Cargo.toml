[package]
name = "hythe"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/hythe-term", "crates/hythe-complete", "crates/hythe-git", "crates/hythe-relay"]

[dependencies]
hythe-term = { path = "crates/hythe-term" }
hythe-complete = { path = "crates/hythe-complete" }
hythe-git = { path = "crates/hythe-git" }
hythe-relay = { path = "crates/hythe-relay" }
iced = { version = "0.14", features = ["canvas", "tokio", "svg", "image"] }
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
rfd = "0.17"
tokio = { version = "1", features = ["rt"] }
serde_json = "1"

[profile.dev]
opt-level = 1
