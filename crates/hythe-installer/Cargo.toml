[package]
name = "hythe-installer"
version = "0.1.0"
edition = "2021"
description = "Single-file Windows installer for Hythe: no Rust toolchain needed"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
